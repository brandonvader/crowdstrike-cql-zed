name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches extension.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' extension.toml | head -n1)
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG != extension.toml version v$version"; exit 1; }
      - name: Build archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --prefix=crowdstrike-cql-zed-${TAG}/ \
            -o crowdstrike-cql-zed-${TAG}.zip HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "crowdstrike-cql-zed-${TAG}.zip" \
            --title "$TAG" --generate-notes
