id = "crowdstrike-cql"
name = "CrowdStrike CQL for Zed"
version = "0.1.0"
schema_version = 1
authors = ["Brandon Vader <brandon@thetechpirate.net>"]
description = "CrowdStrike Query Language (CQL / LogScale / NG-SIEM) support: syntax highlighting, outline, brackets, indentation and snippets."
repository = "https://github.com/brandonvader/crowdstrike-cql-zed"
snippets = ["./snippets/crowdstrike cql.json"]

# The grammar lives in ./grammar of this same repository. Zed clones the repo
# at `rev`, so after changing grammar/ commit and push, then bump `rev`.
[grammars.crowdstrike_cql]
repository = "https://github.com/brandonvader/crowdstrike-cql-zed"
rev = "f20875de4595ea1d141a84c8c6e1a524c83db65f"
path = "grammar"
