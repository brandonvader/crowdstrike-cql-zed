name = "CrowdStrike CQL"
grammar = "crowdstrike_cql"
path_suffixes = ["logscale", "ngsiem", "lql"]
line_comments = ["// "]
block_comment = { start = "/*", prefix = "", end = "*/", tab_size = 1 }
tab_size = 2
autoclose_before = ";:.,=}])|"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "/*", end = " */", close = true, newline = false, not_in = ["comment", "string"] },
]
# #event_simpleName, @timestamp, array:contains, foo.bar
word_characters = ["#", "@", ":", "."]

[overrides.string]
word_characters = ["#", "@", ".", "-"]
